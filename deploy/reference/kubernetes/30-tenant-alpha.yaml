  namespace: loomdb-reference
  labels:
    app.kubernetes.io/name: loomd
    loomdb.io/tenant: alpha
spec:
  serviceName: loomd-alpha
  # One writer. substrate is a single-writer engine per pool, so this is not a scaling knob.
  replicas: 1
