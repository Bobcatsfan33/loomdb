            name: loomd-front-door
        - name: actor-registry
          secret:
            secretName: loomd-actor-registry
            defaultMode: 0440
        - name: front-door-identity
          secret:
            secretName: loomd-frontdoor-identity
            defaultMode: 0440
        - name: policy
          secret:
            secretName: loomd-policy
            defaultMode: 0440
