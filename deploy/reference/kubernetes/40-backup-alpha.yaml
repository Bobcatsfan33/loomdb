    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app.kubernetes.io/name: loomd
            loomdb.io/tenant: alpha
            loomdb.io/role: backup
        spec:
          serviceAccountName: loomd-backup
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
