# Backup operations for tenant 'alpha'.
#
# THE SOURCE IS A CLONE, NOT THE LIVE VOLUME. loomd holds an exclusive advisory lock on its store
# for the process lifetime, so a job that mounted 'loomd-data-alpha' could not read it. The
# platform snapshots that volume and binds the result as 'loomd-snapshot-alpha'; only the backup job
# mounts it, read-only.
#
# THE WRITER AND THE VERIFIER ARE DIFFERENT IDENTITIES. The backup job runs as
# 'loomd-backup' and mounts the signing key. The verifier and the rehearsal run as
# 'loomd-backup-verifier' and mount the public trust root. Neither can do the other's job, so a
# compromise of the thing that writes backups cannot also mint the verification that blesses them.
