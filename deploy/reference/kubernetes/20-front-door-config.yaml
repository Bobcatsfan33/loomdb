# GENERATED by scripts/render_host_profile.py from deploy/reference/profile.json.
# Do not edit by hand: `python3 scripts/verify_host_profile.py` fails on drift.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loomd-front-door
  namespace: loomdb-reference
data:
  # The host owns the front door. loomDB ships no network listener: `loomd` speaks newline-delimited
  # JSON-RPC over stdio, and this proxy is the only thing bound to the pod's address. It terminates
  # mTLS on 8443, authorizes the client's authenticated SPIFFE identity (a valid
  # certificate is not enough), and forwards to the loopback stdio bridge on
  # 127.0.0.1:9090. The admin interface is loopback-only
  # because it can drain listeners and dump the running config; the health listener answers a static
  # 200 on 9902 and carries no engine data.
  #
  # Generated from a structure, not a template — see to_yaml() in scripts/render_host_profile.py.
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: "127.0.0.1"
          port_value: 9901
    static_resources:
      listeners:
        - name: "loomd_mtls"
          address:
            socket_address:
              address: "0.0.0.0"
              port_value: 8443
          filter_chains:
            - filters:
                - name: "envoy.filters.network.rbac"
                  typed_config:
                    "@type": "type.googleapis.com/envoy.extensions.filters.network.rbac.v3.RBAC"
                    stat_prefix: "loomd_authz"
                    rules:
                      action: "ALLOW"
                      policies:
                        authorized_agents:
                          permissions:
                            - any: true
                          principals:
                            - or_ids:
                                ids:
                                  - authenticated:
                                      principal_name:
                                        exact: "spiffe://example.org/ns/agent-runtime/sa/agent-gateway"
                - name: "envoy.filters.network.tcp_proxy"
                  typed_config:
                    "@type": "type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy"
                    stat_prefix: "loomd"
                    cluster: "loomd_stdio_bridge"
              transport_socket:
                name: "envoy.transport_sockets.tls"
                typed_config:
                  "@type": "type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.DownstreamTlsContext"
                  require_client_certificate: true
                  common_tls_context:
                    tls_params:
                      tls_minimum_protocol_version: "TLSv1_3"
                    tls_certificates:
                      - certificate_chain:
                          filename: "/etc/loomd/identity/tls.crt"
                        private_key:
                          filename: "/etc/loomd/identity/tls.key"
                    validation_context:
                      trusted_ca:
                        filename: "/etc/loomd/identity/client-ca.crt"
                      match_typed_subject_alt_names:
                        - san_type: "URI"
                          matcher:
                            prefix: "spiffe://example.org/"
        - name: "health"
          address:
            socket_address:
              address: "0.0.0.0"
              port_value: 9902
          filter_chains:
            - filters:
                - name: "envoy.filters.network.http_connection_manager"
                  typed_config:
                    "@type": "type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager"
                    stat_prefix: "health"
                    route_config:
                      virtual_hosts:
                        - name: "health"
                          domains:
                            - "*"
                          routes:
                            - match:
                                path: "/healthz"
                              direct_response:
                                status: 200
                                body:
                                  inline_string: "ok"
                    http_filters:
                      - name: "envoy.filters.http.router"
                        typed_config:
                          "@type": "type.googleapis.com/envoy.extensions.filters.http.router.v3.Router"
      clusters:
        - name: "loomd_stdio_bridge"
          type: "STATIC"
          load_assignment:
            cluster_name: "loomd_stdio_bridge"
            endpoints:
              - lb_endpoints:
                  - endpoint:
                      address:
                        socket_address:
                          address: "127.0.0.1"
                          port_value: 9090
