[workspace]
resolver = "2"
members = [
    "crates/loom-core",
    "crates/loom-branch",
    "crates/loom-provenance",
    "crates/loom-bench",
    "crates/loom-memory",
    "crates/loom-policy",
    "crates/loom-action",
    "crates/loom-mcp",
    "crates/loom-query",
    "crates/loom-soak",
    "crates/loom-bundle",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Bobcatsfan33/loomdb"
homepage = "https://github.com/Bobcatsfan33/loomdb"

[workspace.dependencies]
# --- the engine ---
#
# Pinned to an immutable revision, never a branch. This reviewed commit upgrades the
# object-storage chain to quick-xml 0.41 and closes RUSTSEC-2026-0194/0195. Move the pin
# to the next signed Substrate release tag after the dependency PR is merged and released.
substrate-pager = { git = "https://github.com/Bobcatsfan33/substrate", rev = "d73fb0325218a991e35c16700e5c66d2fde8ae90" }
substrate-wal = { git = "https://github.com/Bobcatsfan33/substrate", rev = "d73fb0325218a991e35c16700e5c66d2fde8ae90" }
substrate-store = { git = "https://github.com/Bobcatsfan33/substrate", rev = "d73fb0325218a991e35c16700e5c66d2fde8ae90" }
substrate-security = { git = "https://github.com/Bobcatsfan33/substrate", rev = "d73fb0325218a991e35c16700e5c66d2fde8ae90" }

# --- internal ---
loom-core = { path = "crates/loom-core", version = "0.1.0" }
loom-branch = { path = "crates/loom-branch", version = "0.1.0" }
loom-provenance = { path = "crates/loom-provenance", version = "0.1.0" }

# --- deps ---
thiserror = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
blake3 = "1.5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
proptest = "1.5"
tempfile = "3"
fs2 = "0.4"

[profile.release]
debug = true
overflow-checks = true

[profile.test]
overflow-checks = true
