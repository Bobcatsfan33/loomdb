name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --all --check

  clippy:
    name: clippy -D warnings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --lib --bins --tests, NOT --all-targets. `--all-targets` implies `--benches`, and a
      # `harness = false` bench is a plain `main()` — so `cargo test --all-targets` *runs* every
      # benchmark to completion. `ann_amplification` builds an 8000-record HNSW graph (145 s in
      # release, far worse in debug), which hung this job for ~50 min. The benches are still
      # compile-checked by the `clippy -D warnings` job (which does use --all-targets); they must
      # not be executed by the test job. Run them deliberately with `cargo bench`.
      - run: cargo test --workspace --lib --bins --tests
      - run: cargo test --workspace --doc

  # THE ACCEPTANCE TEST. The Q3 demo (docs/04 §3.1), all ten steps, driven through the MCP surface by
  # a scripted agent — no LLM. --nocapture so the narrative is visible in the log: a buyer can read the
  # story, including step 8 (the injection refused) and step 10 (taint naming the account it cannot
  # un-suspend, first). If this goes red, loomdb-v0.1 is not shippable.
  demo:
    name: the Q3 demo (verbatim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p loom-mcp --test demo -- --nocapture

  # The four model oracles. Each is a naive, obviously-correct reference implementation differentially
  # tested against the real engine under randomized operation sequences. Between them they have found
  # multiple real bugs (a double-counted counter on re-merge; provenance overwritten by the data commit;
  # a taint that stopped at merge boundaries). If any goes red, do not ship.
  oracles:
    name: model oracles (branch · taint · isolation · policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p loom-branch --release --test oracle
        env: { PROPTEST_CASES: "2000" }
      - run: cargo test -p loom-provenance --release --test oracle
        env: { TAINT_CASES: "2000" }
      - run: cargo test -p loom-memory --release --test isolation
        env: { ISOLATION_CASES: "1000" }
      - run: cargo test -p loom-policy --release --test oracle
        env: { POLICY_CASES: "4000" }

  # The HNSW recall oracle at full scale. Like the model oracles and the AT-045 sweep, the heavy version
  # runs here in RELEASE (RECALL_FULL=1) so the debug `test` job stays fast; the debug job runs a small
  # graph that catches gross breakage. recall@10 vs the exact brute-force scan, through the tree.
  recall:
    name: HNSW recall @ full scale (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --release -p loom-memory --test hnsw --test hnsw_store
        env: { RECALL_FULL: "1" }
      - run: cargo test --release -p loom-branch --test ann
        env: { RECALL_FULL: "1" }

  # AT-045 — crash at every byte boundary, under a LoomDB-shaped workload, with one CrashVfs under both
  # the pager and the ref store. The exhaustive every-byte sweep (AT045_STRIDE=1); the in-suite default
  # samples ~200 points. This is the LoomDB-granularity crash re-assertion — substrate's 50,000-cycle
  # suite covers the engine; this covers the second durable object (the ref write, invariant I-8).
  crash:
    name: AT-045 crash sweep (every byte)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p loom-branch --release --test crash
        env: { AT045_STRIDE: "1" }
