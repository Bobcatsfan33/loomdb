version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # bincode 3.0.0 is a deliberate upstream tombstone (its lib.rs is a
      # compile_error!), so a major bump can never compile here.
      - dependency-name: "bincode"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
