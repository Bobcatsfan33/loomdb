[package]
name = "loom-memory"
version.workspace = true
edition.workspace = true

[dependencies]
loom-core = { path = "../loom-core" }
# default-features = false so loom-memory does not force the remote path on; the airgap posture
# forwards through here (see [features]).
loom-branch = { path = "../loom-branch", default-features = false }
loom-provenance = { path = "../loom-provenance", default-features = false }
substrate-pager.workspace = true
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
blake3 = "1"

[dev-dependencies]
proptest = "1.5"
loom-policy = { path = "../loom-policy" }

[features]
default = ["remote"]
remote = ["loom-branch/remote", "loom-provenance/remote"]
airgap = ["loom-branch/airgap", "loom-provenance/airgap"]
