[package]
name = "loom-mcp"
version.workspace = true
edition.workspace = true

[[bin]]
name = "loomd"
path = "src/main.rs"

[dependencies]
loom-core = { path = "../loom-core" }
loom-branch = { path = "../loom-branch" }
loom-provenance = { path = "../loom-provenance" }
loom-memory = { path = "../loom-memory" }
loom-policy = { path = "../loom-policy" }
loom-action = { path = "../loom-action" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
