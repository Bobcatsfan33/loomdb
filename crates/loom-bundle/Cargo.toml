[package]
name = "loom-bundle"
description = "Signed offline update bundles for air-gapped LoomDB: a versioned payload (license, policy, model artifact, software) plus an Ed25519 signature an enclave verifies with no network."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "loom-bundle-tool"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { workspace = true }
blake3.workspace = true
serde.workspace = true
bincode.workspace = true
thiserror.workspace = true
# Filling a 32-byte key seed for `keygen`. Same crate the rest of LoomDB uses for key material.
getrandom = "0.2"

[dependencies.clap]
version = "4"
features = ["derive"]
