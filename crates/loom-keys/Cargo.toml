[package]
name = "loom-keys"
description = "Trust-root custody: a signer interface, a named-key register, and offline verification for every loomDB signing role."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aws-config = { version = "1.8.13", default-features = false, features = ["rt-tokio", "behavior-version-latest"], optional = true }
aws-sdk-kms = { version = "1.99.0", default-features = false, features = ["rt-tokio", "behavior-version-latest"], optional = true }
# Verification must work inside an enclave with no network and no KMS reachable, so this crate has
# no transport of any kind: Ed25519, serde, and the filesystem. A backend that talks to a remote HSM
# implements `Signer` in its own crate and never enters a verifier's dependency graph.
ed25519-dalek.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1.53.1", default-features = false, features = ["rt-multi-thread"], optional = true }

[dev-dependencies]
tempfile.workspace = true

[features]
default = []
# The AWS KMS signer backend. OFF by default and deliberately so: loom-keys is in loomd's air-gap
# dependency graph, and an AWS SDK there would break the claim that the air-gap binary links no
# network client. Enable it in signing tools only. scripts/verify_build_flavours.sh asserts the
# air-gap graph carries no aws-sdk crate, so this cannot regress quietly.
aws-kms = ["dep:aws-sdk-kms", "dep:aws-config", "dep:tokio"]
